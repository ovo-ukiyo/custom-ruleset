[General]
name=Split_Domestic_Foreign

[Proxy Group]
; =======================================================
; 1. 顶层策略组 (你操作的开关)
; =======================================================

; 【国外流量】：负责处理 Google, YouTube, GitHub 等
; 默认选中 "♻️ 国外自动"，你也可以手动选 "🌍 国外节点池" 里的特定节点
custom_proxy_group=🚀 国外流量`select`[]♻️ 国外自动`[]🌍 国外节点池`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇸 美国节点

; 【国内流量】：负责处理 Bilibili, 百度, 淘宝 等
; 默认选中 "DIRECT" (本地直连)，但你可以手动选 "🇨🇳 国内节点池" 来走国内中转
custom_proxy_group=🏠 国内流量`select`[]DIRECT`[]🇨🇳 国内节点池`[]♻️ 国内自动

; 【漏网之鱼】：未匹配规则的流量
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 国外流量`[]🏠 国内流量`[]DIRECT

; =======================================================
; 2. 节点池 (把节点搂在一起的地方)
; =======================================================

; 自动抓取所有【非】中国节点 (利用正则反向匹配)
; 解释：^(?!.*...) 表示“不包含”
custom_proxy_group=🌍 国外节点池`select`^(?!.*(CN|China|ZhongGuo|中国|北京|上海|广州|深圳|杭州|徐州|青岛|宁波|镇江|联通|电信|移动|🇨🇳)).*

; 自动抓取所有中国节点
; 解释：只要名字里有 CN, China, 中国, 以及常见城市名
custom_proxy_group=🇨🇳 国内节点池`select`(CN|China|ZhongGuo|中国|北京|上海|广州|深圳|杭州|徐州|青岛|宁波|镇江|联通|电信|移动|🇨🇳)

; =======================================================
; 3. 自动测速与地区分组 (辅助功能)
; =======================================================

; 国外自动测速
custom_proxy_group=♻️ 国外自动`url-test`^(?!.*(CN|China|ZhongGuo|中国|北京|上海|广州|深圳|杭州|徐州|青岛|宁波|镇江|联通|电信|移动|🇨🇳)).*`http://www.gstatic.com/generate_204`300,,50

; 国内自动测速 (如果你想自动连最快的国内节点)
custom_proxy_group=♻️ 国内自动`url-test`(CN|China|ZhongGuo|中国|北京|上海|广州|深圳|杭州|徐州|青岛|宁波|镇江|联通|电信|移动|🇨🇳)`http://www.gstatic.com/generate_204`300,,50

; 地区分组 (方便你快速找节点)
custom_proxy_group=🇭🇰 香港节点`url-test`(HK|Hong|HongKong|🇭🇰|香港)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(JP|Japan|🇯🇵|日本)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(US|United|America|🇺🇸|美国)`http://www.gstatic.com/generate_204`300,,50

[Rule]
; =======================================================
; 规则分流配置
; =======================================================

; 1. 广告拦截 -> 直接拒绝
ruleset=REJECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list

; 2. 局域网 -> 直连 (不走任何代理)
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; 3. 【重点】国内流量规则 -> 指向 "🏠 国内流量"
; 包含常见国内网站、App、中国公司IP
ruleset=🏠 国内流量,[]GEOIP,CN
ruleset=🏠 国内流量,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaApps.list
ruleset=🏠 国内流量,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🏠 国内流量,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🏠 国内流量,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list

; 4. 【重点】国外流量规则 -> 指向 "🚀 国外流量"
; 包含 Google, Telegram, Netflix, 代理列表
ruleset=🚀 国外流量,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Google.list
ruleset=🚀 国外流量,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🚀 国外流量,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Netflix.list
ruleset=🚀 国外流量,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list

; 5. 兜底 -> 漏网之鱼
; 这里的逻辑由 [Proxy Group] 里的 "🐟 漏网之鱼" 决定
ruleset=🐟 漏网之鱼,[]FINAL


enable_rule_generator=true
overwrite_original_rules=true
